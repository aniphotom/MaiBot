name: Manual Deploy

# 只部署 ghcr.io/aniphotom/maibot。tag 留空时用该镜像的 latest，拉取后固定 digest。
# latest 只来自 Build and Push (Self) 的成功构建，不会改去官方仓库。
# 不上传、不覆盖服务器上的 compose，避免用本分支的旧编排盖住已升级的核心。
# 切换或健康检查失败时恢复部署前的 core。不在这里构建。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "留空=自有镜像 latest。也可填 sha-<40位提交> 或 sha256:<64位digest>"
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-maibot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
      DEPLOY_USER: ${{ secrets.SERVER_USER }}
      DEPLOY_DIR: project/maibot
    steps:
      - uses: actions/checkout@v4

      - name: 解析镜像引用
        env:
          IMAGE_REF: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          image=ghcr.io/aniphotom/maibot
          ref="${IMAGE_REF:-}"
          ref="${ref//[[:space:]]/}"
          if [ -z "$ref" ] || [ "$ref" = "latest" ] || [ "$ref" = "${image}:latest" ]; then
            value="${image}:latest"
          else
            stripped=$ref
            stripped=${stripped#"${image}:"}
            stripped=${stripped#"${image}@"}
            if [[ "$stripped" =~ ^sha-[0-9a-f]{40}$ ]]; then
              value="${image}:${stripped}"
            elif [[ "$stripped" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              value="${image}@${stripped}"
            else
              echo "只接受留空、${image} 的 latest、sha-<40位提交> 或 sha256:<64位digest>" >&2
              exit 1
            fi
          fi
          echo "部署目标 ${value}；拉取成功后会改写为 digest"
          echo "MAIBOT_IMAGE=${value}" >> "$GITHUB_ENV"

      - name: 配置 SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 上传部署脚本
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_DIR/.deploy-rollback'"
          scp .github/scripts/manual-deploy-core.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/.deploy-rollback/manual-deploy-core.${GITHUB_RUN_ID}.sh"

      - name: 拉取、切换，失败则恢复原 core
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' WANT_IMAGE='$MAIBOT_IMAGE' bash '$DEPLOY_DIR/.deploy-rollback/manual-deploy-core.${GITHUB_RUN_ID}.sh'"
