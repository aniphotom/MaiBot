name: Build and Push (Self)

# 仅手动构建 linux/amd64，推到本仓库 GHCR。成功后不部署。
# 镜像名与 Manual Deploy、docker-compose.yml 相同：ghcr.io/aniphotom/maibot
# 标记只有 sha-<完整提交>。日志中的 digest 可直接填到 Manual Deploy 的 tag。

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-maibot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aniphotom/maibot
          tags: |
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 打印提交与镜像标记
        run: |
          echo "commit=${{ github.sha }}"
          echo "tag=${{ steps.meta.outputs.tags }}"
          echo "digest=${{ steps.build.outputs.digest }}"
          echo "by_digest=ghcr.io/aniphotom/maibot@${{ steps.build.outputs.digest }}"
