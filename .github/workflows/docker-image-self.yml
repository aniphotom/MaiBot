name: Build and Push (Self)

# 仅手动构建 linux/amd64，推到本仓库 GHCR。成功后不部署。
# 镜像名与 Manual Deploy、docker-compose.yml 相同：ghcr.io/aniphotom/maibot
# 不可变标记是 sha-<完整提交>。成功且没有更新的构建时，再把同一 digest 标为 latest。
# latest 只指向本仓库 GHCR。日志中的 digest 可直接填到 Manual Deploy 的 tag。

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: build-maibot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aniphotom/maibot
          tags: |
            type=raw,value=sha-${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 打印提交与镜像标记
        run: |
          echo "commit=${{ github.sha }}"
          echo "tag=${{ steps.meta.outputs.tags }}"
          echo "digest=${{ steps.build.outputs.digest }}"
          echo "by_digest=ghcr.io/aniphotom/maibot@${{ steps.build.outputs.digest }}"

      # 旧构建若在更新的构建已经成功或仍在排队/进行时结束，不覆盖 latest。
      - name: 更新 latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image=ghcr.io/aniphotom/maibot
          newer="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/docker-image-self.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id > ${GITHUB_RUN_ID} and (.status == \"queued\" or .status == \"in_progress\" or .conclusion == \"success\"))] | length")"
          if [ "$newer" != "0" ]; then
            echo "已有更新的构建（${newer}），保留现有 latest"
            exit 0
          fi
          docker buildx imagetools create -t "${image}:latest" "${image}@${{ steps.build.outputs.digest }}"
          echo "latest=${image}:latest"
          echo "latest_digest=${{ steps.build.outputs.digest }}"
